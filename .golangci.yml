version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close
    gosec:
      excludes:
        # Launching a user-chosen command is the product's job; the policy
        # package decides what may run.
        - G204
        # Reading the config file and the program about to run is the point.
        - G304

  exclusions:
    rules:
      # Tests use math/rand, run their own binary and index fixtures freely.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
