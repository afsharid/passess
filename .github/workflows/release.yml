name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      # checkout leaves the tag lightweight; fetch it again for its message.
      - name: Release notes from the tag's message
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          notes=$(git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}")
          [ -n "$notes" ] || notes=$(git tag -l --format='%(contents:subject)' "${GITHUB_REF_NAME}")
          printf '%s\n' "$notes" > "${RUNNER_TEMP}/notes.md"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*.tar.gz"

  macos-app:
    needs: cli
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The tag reaches the shell through the environment, never as script
      # text, and only when it is a plain version.
      - name: Check the tag
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*) ;;
            *) echo "not a version tag: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
          if printf '%s' "$GITHUB_REF_NAME" | LC_ALL=C grep -q '[^A-Za-z0-9.+_-]'; then
            echo "the tag holds characters a version does not" >&2; exit 1
          fi
      - run: make macos-check
      - run: make macos-app VERSION="$GITHUB_REF_NAME"
      - run: ditto -c -k --keepParent bin/Passess.app "Passess-${GITHUB_REF_NAME}-macos-arm64.zip"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "Passess-*.zip"
      - run: gh release upload "$GITHUB_REF_NAME" "Passess-${GITHUB_REF_NAME}-macos-arm64.zip"
        env:
          GH_TOKEN: ${{ github.token }}
