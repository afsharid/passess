name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      # checkout leaves the tag lightweight; fetch it again for its message.
      - name: Release notes from the tag's message
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          notes=$(git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}")
          [ -n "$notes" ] || notes=$(git tag -l --format='%(contents:subject)' "${GITHUB_REF_NAME}")
          printf '%s\n' "$notes" > "${RUNNER_TEMP}/notes.md"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.tar.gz"

  macos-app:
    needs: cli
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make macos-check
      - run: make macos-app VERSION=${{ github.ref_name }}
      - run: ditto -c -k --keepParent bin/Passess.app "Passess-${{ github.ref_name }}-macos-arm64.zip"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "Passess-*.zip"
      - run: gh release upload "${{ github.ref_name }}" "Passess-${{ github.ref_name }}-macos-arm64.zip"
        env:
          GH_TOKEN: ${{ github.token }}
